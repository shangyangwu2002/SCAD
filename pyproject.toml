[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scad"
version = "0.1.0"
description = "SCAD: Structured Credit Assignment and Distillation for Long-Horizon Agents"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "configs*", "envs*", "samplers*", "scripts*", "verl*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.yaml", "*.json"]
scripts = ["*.sh"]
verl = ["py.typed", "version/version", "**/*.yaml", "**/*.yml", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
